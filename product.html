<script>
/* a plain message instead of a blank page when the page cannot start: opened as a file, or a script that did not load */
(function () {
  function say(t) {
    if (document.getElementById('bootMsg')) return;
    var d = document.createElement('div'); d.id = 'bootMsg'; d.className = 'noscript'; d.setAttribute('role', 'alert');
    var p = document.createElement('p'); p.textContent = t; d.appendChild(p);
    (document.body || document.documentElement).appendChild(d);
  }
  if (location.protocol === 'file:') {
    document.addEventListener('DOMContentLoaded', function () { say('JALRANG cannot run straight from a file. Open "Open JALRANG.bat" in the folder, or use the published link.'); });
    return;
  }
  addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'SCRIPT') say('Something did not load. Please check your connection and reload the page.');
  }, true);
})();
</script>
